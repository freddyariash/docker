services:
  db:
    image: mysql:8.4
    container_name: projects-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Root1234!"
      MYSQL_DATABASE: "appdb"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "App1234!"
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pRoot1234!"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    container_name: projects-api
    restart: unless-stopped
    environment:
      MYSQL_HOST: "db"
      MYSQL_PORT: "3306"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "App1234!"
      MYSQL_DATABASE: "appdb"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  adminer:
    image: adminer:latest
    container_name: projects-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: "db"
    depends_on:
      - db

volumes:
  db_data:
